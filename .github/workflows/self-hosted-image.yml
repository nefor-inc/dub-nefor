name: Self-hosted image

on:
  push:
    branches: [main, feature/self-hosted-nefor]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: self-hosted-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nefor-inc/dub-nefor
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=candidate,enable=${{ github.ref_name == 'feature/self-hosted-nefor' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.self-hosted
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

